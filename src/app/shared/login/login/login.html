<form [formGroup]="loginForm" (ngSubmit)="submitForm()" #formLogin class="dropdown-menu bg-dark form-login" aria-labelledby="navbarDropdown">
  <h2 class="text-white h2-login">Login</h2>
  <div class="form-floating mb-3">
    <input formControlName="username" type="text" class="form-control" placeholder="name@example.com">
    <label for="floatingInput">Usuario</label>
  </div>
  <div class="form-floating">
    <input formControlName="password" type="password" class="form-control" placeholder="Password">
    <label for="floatingPassword">Contraseña</label>
  </div>
  <div class="mt-3 d-flex justify-content-center">
    <button class="btn btn-outline-primary" type="submit">Iniciar Sesión</button>
  </div>
</form>
