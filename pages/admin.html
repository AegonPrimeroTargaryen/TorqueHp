<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
  <script src="../js/registro.js"></script>

  <title>Torque Hp</title>
  <link rel="stylesheet" href="../css/estilo.css">

</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Torque Hp</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <main class="bg-secondary">
        <div class="container">
            <article class="row d-flex justify-content-center">
                <div class="col-6">
                    <h2 class="text-center">Registrar Usuario</h2>
                    <form id="form-registro">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="reg-nombre" placeholder="">
                            <label for="reg-nombre">Nombre</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="reg-username" placeholder="">
                            <label for="reg-username">Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="reg-pass" placeholder="">
                            <label for="reg-pass">Password</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="reg-rol" placeholder="">
                            <label for="reg-rol">Rol</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrar</button>
                    </form>
                </div>
            </article>
        </div>
    </main>

    <footer class="bg-dark">
        <div class="container">
            <div class="row">
                <div class="col-4">
                    <h5>Links</h5>
                </div>
                <div class="col-4">
                    <h5>Redes Sociales</h5>
                </div>
                <div class="col-4">
                    <h5>Suscribete</h5>
                </div>
            </div>
            <div class="row">
                <h6>Copyright 2018 © All rights Reserved.</h5>
                <h6>Desarrollado por <strong>Kevin Molina</strong></h5>
            </div>
        </div>
    </footer>
</body>
</html>
